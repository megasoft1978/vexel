<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <!-- Static frame of what effect_apply generates: speed_lines, glow, halftone,
       vhs_scanlines and vignette over one hero shape. Ids match the default
       idPrefix scheme; the tracks that animate them are not part of the file. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1050"/>
      <stop offset="1" stop-color="#d9487a"/>
    </linearGradient>
    <filter id="fx-glow-1-f" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur id="fx-glow-1-blur" stdDeviation="10"/>
    </filter>
    <pattern id="fx-halftone-1-pat" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle id="fx-halftone-1-dot" cx="5" cy="5" r="2.5" fill="#000"/>
    </pattern>
    <pattern id="fx-vhs-1-pat" x="0" y="0" width="8" height="4" patternUnits="userSpaceOnUse">
      <rect width="8" height="2" fill="#000"/>
    </pattern>
    <radialGradient id="fx-vignette-1-g" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.35" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.7"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#sky)"/>
  <rect x="0" y="180" width="640" height="180" fill="url(#fx-halftone-1-pat)" opacity="0.35" style="mix-blend-mode:multiply"/>
  <g id="fx-speed_lines-1-v0" opacity="0.8" fill="#fff">
    <polygon points="320,180 640,168 640,192"/>
    <polygon points="320,180 600,0 624,20"/>
    <polygon points="320,180 0,150 0,176"/>
    <polygon points="320,180 40,360 14,336"/>
    <polygon points="320,180 330,0 352,0"/>
    <polygon points="320,180 300,360 278,360"/>
  </g>
  <g id="hero">
    <circle cx="320" cy="180" r="62" fill="#ffe94d"/>
    <circle cx="320" cy="180" r="62" fill="#ffe94d" filter="url(#fx-glow-1-f)" style="mix-blend-mode:plus-lighter" opacity="0.8"/>
  </g>
  <rect width="640" height="360" fill="url(#fx-vhs-1-pat)" opacity="0.3"/>
  <rect width="640" height="360" fill="url(#fx-vignette-1-g)"/>
</svg>
