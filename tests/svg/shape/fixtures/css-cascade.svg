<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16">
  <style>/* class, id, type and inheritance */
    rect { fill: blue; }
    .red, rect.alt { fill: red; }
    #special.blue { fill: green !important; }
  </style>
  <rect class="red" x="0" y="0" width="4" height="8"/>
  <rect id="special" class="blue extra" x="4" y="0" width="4" height="8" fill="white"/>
  <g fill="red"><g><rect x="8" y="0" width="4" height="8"/></g></g>
  <rect x="12" y="0" width="4" height="8" fill="blue" style="fill: green !important"/>
</svg>
