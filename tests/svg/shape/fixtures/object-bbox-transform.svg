<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16">
  <defs>
    <linearGradient id="linear" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#e02020"/><stop offset="1" stop-color="#2040e0"/>
    </linearGradient>
    <radialGradient id="radial" cx="0.5" cy="0.5" r="1">
      <stop stop-color="white"/><stop offset="1" stop-color="black"/>
    </radialGradient>
    <clipPath id="clip" clipPathUnits="objectBoundingBox"><rect width="0.5" height="1"/></clipPath>
  </defs>
  <g transform="translate(12 0) rotate(90)">
    <rect width="4" height="8" fill="url(#linear)" clip-path="url(#clip)"/>
  </g>
  <g transform="translate(8 8) scale(1.5)">
    <rect width="4" height="4" fill="url(#radial)"/>
  </g>
</svg>
