name: macOS app bundle draft

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-dmg:
    name: Build Vexel.app and attach Vexel.dmg
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build, sign, and verify the app and disk image
        run: ./dev dmg
      - name: Attach DMG to the tag or manual workflow run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Vexel-${{ github.ref_name }}-macos-arm64
          path: build/Vexel.dmg
          if-no-files-found: error
