name: macOS CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64:
    name: macOS Apple Silicon
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Check formatting (clean-listed crates)
        run: python3 scripts/check_rust_fmt.py
      - name: Check workspace
        run: cargo check --workspace --locked
      - name: Run tests
        run: cargo test --workspace --locked -- --test-threads=1 --skip a_thousand_pan_events_present_within_the_frame_budget
        env:
          VEXEL_CHROME_GOLDEN_DIAGNOSTICS: "1"
      - name: Pan-present timing gate (release build, unchanged 15,657 ms budget)
        run: cargo test --release --locked -p vexel-app --test ui_canvas_pointer a_thousand_pan_events_present_within_the_frame_budget -- --test-threads=1
      - name: Clippy (informational, runs only when available)
        continue-on-error: true
        run: |
          if cargo clippy --version; then
            cargo clippy --workspace --locked
          else
            echo "::notice::cargo clippy is not available; skipped"
          fi
      - name: Fetch dependencies for the offline bundle smoke
        if: github.event_name == 'workflow_dispatch'
        env:
          CARGO_HOME: ${{ github.workspace }}/.cache/cargo
        run: cargo fetch --locked
      - name: Bundle, DMG, SBOM and install smoke (ad-hoc signed, no GUI launch)
        if: github.event_name == 'workflow_dispatch'
        env:
          CARGO_HOME: ${{ github.workspace }}/.cache/cargo
        run: |
          cargo run -p vexel-dev --locked -- bundle
          cargo run -p vexel-dev --locked -- dmg
          cargo run -p vexel-dev --locked -- sbom
          cargo run -p vexel-dev --locked -- install-smoke
