name: macOS CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64:
    name: macOS Apple Silicon
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install librsvg (reference renderer for differential tests)
        run: brew install librsvg
      - name: Build and run fast verification
        env:
          # Shared hosted runners jitter; the strict 100 ms owner-step gate stays the local default.
          VEXEL_OWNER_STEP_LIMIT_MS: "500"
        run: ./dev verify
      - name: Capture UI golden diagnostics
        if: always()
        run: |
          cmake --preset mac-debug
          cmake --build build/mac-debug --target native_ui_render viewer_chrome_render editor_snap_overlay_render editor_chrome_render
          python3 scripts/ui_golden_audit.py \
            --build-dir build/mac-debug \
            --output ".cache/ui-golden-audit/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Upload UI golden diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vexel-ui-golden-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/ui-golden-audit/${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
