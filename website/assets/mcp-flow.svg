<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220" role="img" aria-label="Three canvas stages: a circle is added, keyed to move right, then loops back.">
<style>
.f{fill:#18132f;stroke:#2f2758}.l{fill:none;stroke:#2f2758;stroke-dasharray:4 5}
.b{fill:#d6389f}.k{fill:#f4c46a}.t{fill:#aca5c9;font:10.5px ui-monospace,Menlo,monospace}
.b1{animation:a1 6s var(--e,ease-out) infinite}.b2{animation:a2 6s ease-in-out infinite}.b3{animation:a3 6s ease-in-out infinite}
@keyframes a1{0%,8%{transform:scale(0)}20%,100%{transform:scale(1)}}
@keyframes a2{0%,34%{transform:translateX(0)}60%,100%{transform:translateX(140px)}}
@keyframes a3{0%,60%{transform:translateX(0)}80%,100%{transform:translateX(140px)}85%{transform:translateX(0)}}
.b1,.b2,.b3{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){.b1,.b2,.b3{animation:none}.b1,.b3{transform:none}.b2{transform:translateX(140px)}}
</style>
<g transform="translate(0 10)"><rect class="f" x="1" y="1" width="226" height="170" rx="10"/><path class="l" d="M30 100h168"/><circle class="b b1" cx="64" cy="100" r="22"/><text class="t" x="14" y="196">element_add</text></g>
<g transform="translate(247 10)"><rect class="f" x="1" y="1" width="226" height="170" rx="10"/><path class="l" d="M30 100h168"/><circle class="b b2" cx="64" cy="100" r="22"/><path class="k" d="M64 142l7 7-7 7-7-7zM204 142l7 7-7 7-7-7z" transform="translate(-4 0)"/><text class="t" x="14" y="196">native_timeline_add_property_track</text></g>
<g transform="translate(494 10)"><rect class="f" x="1" y="1" width="226" height="170" rx="10"/><path class="l" d="M30 100h168"/><circle class="b b3" cx="64" cy="100" r="22"/><path d="M180 40a22 22 0 1 0 0 .1" fill="none" stroke="#f4c46a" stroke-width="2" transform="translate(-40 -8)"/><text class="t" x="14" y="196">native_timeline_set_loop</text></g>
</svg>
