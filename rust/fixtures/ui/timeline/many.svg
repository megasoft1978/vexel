<svg xmlns="http://www.w3.org/2000/svg" width="160" height="120" viewBox="0 0 160 120">
<rect id="card" x="10" y="10" width="30" height="20" fill="#e03030"><animate attributeName="x" values="10;100;10" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.3;1" keyTimes="0;0.25;1" dur="4s" repeatCount="indefinite"/></rect>
<ellipse id="dot" cx="40" cy="60" rx="10" ry="6" fill="#2060e0"><animate attributeName="cx" values="40;120;40" dur="3s" repeatCount="indefinite"/><animate attributeName="ry" values="6;12;6" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.5;1" dur="3s" repeatCount="indefinite"/></ellipse>
<rect id="bar" x="10" y="90" width="40" height="10" fill="#20a060"><animate attributeName="width" values="40;120;40" dur="2s" repeatCount="indefinite"/></rect>
<rect id="chip" x="100" y="90" width="20" height="20" fill="#a040e0"><animate attributeName="y" values="90;60;90" begin="1s" dur="2s" repeatCount="indefinite"/><animate attributeName="x" values="100;80;100" dur="2s" repeatCount="indefinite"/></rect>
<circle id="ring" cx="130" cy="30" r="8" fill="#e0a020"><animate attributeName="r" values="8;14;8" dur="1.5s" repeatCount="indefinite"/></circle>
</svg>
