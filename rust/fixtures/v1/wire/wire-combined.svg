      <rect width="5" height="5" fill="#2050c0"/>
      <rect x="5" y="5" width="5" height="5" fill="#c03020"/>
    </pattern>
    <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="96">
      <rect x="4" y="4" width="56" height="40" fill="white"/>
