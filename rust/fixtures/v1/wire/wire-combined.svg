  <rect x="4" y="12" width="40" height="20" fill="url(#p)" stroke="#202020" stroke-width="1"/>
  <rect x="24" y="12" width="28" height="20" fill="url(#p)" fill-opacity="0.7"/>
  <g mask="url(#m)" opacity="0.9"><rect x="0" y="0" width="64" height="48" fill="#c02020"/></g>
