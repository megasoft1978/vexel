[package]
name = "vexel-platform-apple"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
objc2 = { version = "=0.6.5", default-features = false, features = ["catch-all", "std"] }
objc2-encode = { version = "=4.1.0", default-features = false, features = ["std"] }
block2 = { version = "=0.6.2", default-features = false, features = ["std"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSVisualEffectView", "NSImage", "NSBezierPath", "NSGraphicsContext", "NSAccessibility", "NSAccessibilityConstants", "NSAccessibilityElement", "NSAccessibilityProtocols", "NSAlert", "NSAppearance", "NSApplication", "NSButton", "NSColor", "NSColorSpace", "NSControl", "NSCursor", "NSDragging", "NSEvent", "NSGraphics", "NSMenu", "NSMenuItem", "NSOpenPanel", "NSPanel", "NSPasteboard", "NSResponder", "NSRunningApplication", "NSSavePanel", "NSScreen", "NSTextInputClient", "NSTextInputContext", "NSTrackingArea", "NSView", "NSWindow", "NSWorkspace", "block2", "objc2-core-graphics", "objc2-quartz-core", "std"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSProcessInfo", "NSArray", "NSAttributedString", "NSData", "NSDate", "NSDictionary", "NSError", "NSException", "NSGeometry", "NSKeyValueObserving", "NSNotification", "NSObject", "NSOperation", "NSRange", "NSRunLoop", "NSSet", "NSString", "NSThread", "NSTimer", "NSURL", "NSUserDefaults", "NSValue", "block2", "std"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["CFArray", "CFAttributedString", "CFData", "CFDictionary", "CFNumber", "CFRunLoop", "CFString", "objc2", "std"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["CGBitmapContext", "CGColor", "CGColorSpace", "CGContext", "CGDataProvider", "CGDirectDisplay", "CGFont", "CGImage", "CGPath", "objc2", "std"] }
objc2-core-text = { version = "=0.3.2", default-features = false, features = ["CTFont", "CTFontDescriptor", "CTLine", "CTRun", "CTStringAttributes", "objc2", "objc2-core-graphics", "std"] }
objc2-metal = { version = "=0.3.2", default-features = false, features = ["MTLBlitCommandEncoder", "MTLCommandBuffer", "MTLCommandEncoder", "MTLCommandQueue", "MTLDevice", "MTLDrawable", "MTLLibrary", "MTLPixelFormat", "MTLRenderCommandEncoder", "MTLRenderPass", "MTLRenderPipeline", "MTLResource", "MTLTexture", "MTLTypes", "block2", "std"] }
objc2-quartz-core = { version = "=0.3.2", default-features = false, features = ["CALayer", "CAMediaTiming", "CAMetalLayer", "objc2-core-foundation", "objc2-core-graphics", "objc2-metal", "std"] }
objc2-image-io = { version = "=0.3.2", default-features = false, features = ["CGImageDestination", "CGImageProperties", "CGImageSource", "objc2", "objc2-core-graphics", "std"] }
bitflags = { version = "=2.13.2", default-features = false }
objc2-exception-helper = { version = "=0.1.1", default-features = false }

[build-dependencies]
cc = { version = "=1.8.0", default-features = false }
find-msvc-tools = { version = "=0.1.14", default-features = false }
shlex = { version = "=2.0.1", default-features = false }

[dev-dependencies]
vexel-render = { path = "../vexel-render" }
vexel-svg-engine = { path = "../vexel-svg-engine" }
vexel-svg-decode = { path = "../vexel-svg-decode" }
vexel-scene = { path = "../vexel-scene" }
vexel-raster = { path = "../vexel-raster" }
